[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalhealth-storage"
version = "0.1.0"
description = "Shared persistence layer for VitalHealth applications"
requires-python = ">=3.11,<3.13"
dependencies = [
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
]

[tool.setuptools.packages.find]
include = ["vitalhealth_storage*"]
