<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }} | Stroke Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <header class="site-header clinical-header">
        <div class="container header-wrap">
            <div class="brand-block">
                <a class="brand" href="{{ url_for('home') }}">Stroke Assessment</a>
                <p class="brand-subtitle">ML-assisted stroke risk prediction and RAG-enhanced care planning workflow</p>
            </div>

        </div>

        <div class="container nav-wrap">
            <nav class="navbar" aria-label="Primary">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('prediction') }}">Prediction</a>
                <a href="{{ url_for('care_plan') }}">Care Plan</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Educational project. This app does not replace professional medical advice.</p>
        </div>
    </footer>
</body>
</html>
